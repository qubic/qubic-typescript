name: Deploy registry-api

on:
  push:
    branches: [main]
    paths:
      - 'apps/registry-api/**'
      - 'packages/registry/**'

concurrency:
  group: deploy-registry-api
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: bun run build

      - name: Sync changed registry data to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          git diff --name-only HEAD~1 HEAD -- packages/registry/data/ \
            | grep '\.json$' \
            | while read file; do
                key="${file#packages/registry/data/}"
                echo "Uploading $key"
                bunx wrangler r2 object put "registry-data/${key}" \
                  --file "$file" --content-type application/json
              done

      - name: Deploy worker
        working-directory: apps/registry-api
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
