name: Registry Backfill

on:
  schedule:
    # Wednesdays at 14:00 UTC, after the weekly epoch change
    - cron: '0 14 * * 3'
  workflow_dispatch:
    inputs:
      from_epoch:
        description: 'Start epoch (defaults to last known + 1)'
        required: false
      to_epoch:
        description: 'End epoch (defaults to latest available)'
        required: false

concurrency:
  group: registry-backfill
  cancel-in-progress: true

jobs:
  backfill:
    name: Backfill ABI snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # GH_PAT is a fine-grained PAT with contents:write + pull-requests:write on this repo.
    # It bypasses the org-level "Allow GitHub Actions to create pull requests" restriction
    # that prevents GITHUB_TOKEN from opening PRs in organisations where that setting is off.

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build packages needed by backfill and generate scripts
        run: |
          bun run --filter '@qubic.org/types'    build
          bun run --filter '@qubic.org/crypto'   build
          bun run --filter '@qubic.org/registry' build

      - name: Determine epoch range
        id: epochs
        env:
          FROM_EPOCH_INPUT: ${{ github.event.inputs.from_epoch }}
          TO_EPOCH_INPUT: ${{ github.event.inputs.to_epoch }}
        run: |
          if [ -n "$FROM_EPOCH_INPUT" ]; then
            FROM=$FROM_EPOCH_INPUT
          else
            FROM=$(bun -e "
              import { readdirSync } from 'node:fs';
              const dirs = readdirSync('packages/registry/data/epochs')
                .map(Number).filter(n => !isNaN(n));
              console.log(Math.max(...dirs) + 1);
            ")
          fi

          if [ -n "$TO_EPOCH_INPUT" ]; then
            TO=$TO_EPOCH_INPUT
          else
            TO=$(curl -sf https://rpc.qubic.org/live/v1/tick-info \
              | bun -e "const d = await Bun.stdin.json(); console.log(d?.tickInfo?.epoch ?? '')")
            [ -z "$TO" ] && { echo 'Failed to determine current epoch from RPC'; exit 1; }
          fi

          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO"     >> "$GITHUB_OUTPUT"
          echo "Epoch range: $FROM → $TO"

      - name: Run backfill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.from_epoch }}" ] || [ -n "${{ github.event.inputs.to_epoch }}" ]; then
            bun packages/registry/scripts/backfill.ts \
              --from-epoch ${{ steps.epochs.outputs.from }} \
              --to-epoch   ${{ steps.epochs.outputs.to }} \
              --token      "$GITHUB_TOKEN"
          else
            bun packages/registry/scripts/backfill.ts \
              --catch-up \
              --token "$GITHUB_TOKEN"
          fi

      - name: Regenerate contract wrappers
        run: bun packages/contracts/scripts/generate.ts

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet packages/registry/data/ packages/contracts/src/__generated__/ \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Open PR if snapshots or wrappers changed
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="chore/registry-backfill-${DATE}"
          FROM=${{ steps.epochs.outputs.from }}
          TO=${{ steps.epochs.outputs.to }}

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          # Write a changeset so the release workflow picks this up for publishing
          CHANGESET_FILE=".changeset/registry-backfill-${DATE}.md"
          cat > "$CHANGESET_FILE" << EOF
          ---
          "@qubic.org/registry": patch
          "@qubic.org/contracts": patch
          ---

          Update ABI snapshots and contract wrappers for epochs ${FROM}–${TO}.
          EOF

          git add packages/registry/data/ packages/contracts/src/__generated__/ "$CHANGESET_FILE"
          git commit -m "chore(registry): backfill ABI snapshots epochs ${FROM}–${TO}"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(registry): backfill ABI snapshots epochs ${FROM}–${TO}" \
            --body "$(cat <<'EOF'
          Automated weekly backfill of contract ABI snapshots, regenerated contract wrappers, and a patch changeset.

          After merging this PR, the release workflow will open a **Version Packages** PR to bump and publish \`@qubic.org/registry\` and \`@qubic.org/contracts\` (and all other packages in the fixed group).

          Generated by the **Registry Backfill** workflow.
          EOF
          )"
