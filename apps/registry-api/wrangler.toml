name = "registry-api"
main = "src/server.ts"

[build]
command = "bun --cwd ../.. run --filter @qubic.org/types build && bun --cwd ../.. run --filter @qubic.org/registry build"

compatibility_date = "2025-05-15"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "registry.qubickit.dev/*"
zone_name = "qubickit.dev"

[[r2_buckets]]
binding = "REGISTRY_BUCKET"
bucket_name = "registry-data"
