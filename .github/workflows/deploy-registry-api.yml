name: Deploy registry-api

on:
  push:
    branches: [main]
    paths:
      - 'apps/registry-api/**'
      - 'packages/registry/**'

concurrency:
  group: deploy-registry-api
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: bun run build

      - name: Sync changed registry data to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git diff --name-only HEAD~1 HEAD -- packages/registry/data/ \
            | grep '\.json$' \
            | while read file; do
                key="${file#packages/registry/data/}"
                echo "Uploading $key"
                curl -sf -X PUT \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/registry-data/objects/${key}" \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H "content-type: application/json" \
                  --data-binary "@${file}" > /dev/null
                echo "✓ $key"
              done

      - name: Deploy worker
        working-directory: apps/registry-api
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
