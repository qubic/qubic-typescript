name: Registry Backfill

on:
  schedule:
    # Wednesdays at 14:00 UTC — 2 h after the epoch change at 12:00 UTC
    - cron: '0 14 * * 3'
  workflow_dispatch:
    inputs:
      from_epoch:
        description: 'Start epoch (defaults to last known + 1)'
        required: false
      to_epoch:
        description: 'End epoch (defaults to latest available)'
        required: false

concurrency:
  group: registry-backfill
  cancel-in-progress: true

jobs:
  backfill:
    name: Backfill ABI snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build registry package
        run: bun run --filter '@qubic.org/registry' build

      - name: Determine epoch range
        id: epochs
        env:
          FROM_EPOCH_INPUT: ${{ github.event.inputs.from_epoch }}
          TO_EPOCH_INPUT: ${{ github.event.inputs.to_epoch }}
        run: |
          if [ -n "$FROM_EPOCH_INPUT" ]; then
            FROM=$FROM_EPOCH_INPUT
          else
            FROM=$(bun -e "
              import { readdirSync } from 'node:fs';
              const dirs = readdirSync('packages/registry/data/epochs')
                .map(Number).filter(n => !isNaN(n));
              console.log(Math.max(...dirs) + 1);
            ")
          fi

          if [ -n "$TO_EPOCH_INPUT" ]; then
            TO=$TO_EPOCH_INPUT
          else
            # Derive current epoch from the latest qubic/core tag (v1.N.x → epoch N)
            LATEST_TAG=$(curl -sf \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/qubic/core/tags?per_page=1" \
              | bun -e "const d = await Bun.stdin.json(); console.log(d[0]?.name ?? '')")
            TO=$(echo "$LATEST_TAG" | sed 's/^v[0-9]*\.\([0-9]*\)\.[0-9]*/\1/')
            [ -z "$TO" ] && TO=9999
          fi

          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO"     >> "$GITHUB_OUTPUT"
          echo "Epoch range: $FROM → $TO"

      - name: Run backfill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun packages/registry/scripts/backfill.ts \
            --from-epoch ${{ steps.epochs.outputs.from }} \
            --to-epoch   ${{ steps.epochs.outputs.to }} \
            --token      "$GITHUB_TOKEN"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet packages/registry/data/ \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Open PR if snapshots changed
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="chore/registry-backfill-${DATE}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add packages/registry/data/
          git commit -m "chore(registry): backfill ABI snapshots epochs ${{ steps.epochs.outputs.from }}–${{ steps.epochs.outputs.to }}"
          git push origin "$BRANCH"

          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "chore(registry): backfill ABI snapshots epochs ${{ steps.epochs.outputs.from }}–${{ steps.epochs.outputs.to }}" \
            --body "$(cat <<'EOF'
          Automated weekly backfill of contract ABI snapshots and registry.json version ranges.

          Generated by the **Registry Backfill** workflow.
          EOF
          )"
